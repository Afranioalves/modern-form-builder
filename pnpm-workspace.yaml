packages:
  - "packages/*"
  - "apps/*"
  # apps/docs manages its own install (plain npm, flat node_modules) instead of joining the
  # pnpm-symlinked workspace store - see apps/docs/README or the commit that introduced this for
  # why: vitepress's CLI entry hits a Node 22 `ERR_REQUIRE_CYCLE_MODULE` false positive specifically
  # under pnpm's symlinked node_modules layout, which a flat install does not trigger.
  - "!apps/docs"
